# Nginx configuration for download.amsol.ca (Coolify / Caddy Proxy)
map $uri $github_fallback_url {
    default                              "";
    /magicpdf-latest.zip                 "https://github.com/alaahadyhostinger/magicpdf/releases/latest/download/magicpdf-portable.zip";
    /magicpdf-portable.zip               "https://github.com/alaahadyhostinger/magicpdf/releases/latest/download/magicpdf-portable.zip";
    /magicpdf-setup.exe                  "https://github.com/alaahadyhostinger/magicpdf/releases/latest/download/magicpdf-setup.exe";
    /magicvideo-latest.zip               "https://github.com/alaahadyhostinger/magicvideo/releases/latest/download/magicvideo-portable.zip";
    /magicvideo-portable.zip             "https://github.com/alaahadyhostinger/magicvideo/releases/latest/download/magicvideo-portable.zip";
    /magicvideo-setup.exe                "https://github.com/alaahadyhostinger/magicvideo/releases/latest/download/magicvideo-setup.exe";
    /magicvideo-latest.dmg               "https://github.com/alaahadyhostinger/magicvideo/releases/latest/download/magicvideo-macos.dmg";
    /magicwatch-setup-latest.zip         "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicwatch-setup-latest.zip";
    /magicwatch-latest.zip               "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicwatch-latest.zip";
    /magicmidi-setup-latest.zip          "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicmidi-setup-latest.zip";
    /magicmidi-latest.zip                "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicmidi-latest.zip";
    /magicnorton-setup-latest.zip        "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicnorton-setup-latest.zip";
    /magicnorton-latest.zip              "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicnorton-latest.zip";
    /magiclivecamera-setup-latest.zip    "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magiclivecamera-setup-latest.zip";
    /magiclivecamera-latest.zip          "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magiclivecamera-latest.zip";
    /magicsudoku-setup-latest.zip        "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicsudoku-setup-latest.zip";
    /magicsudoku-latest.zip              "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicsudoku-latest.zip";
    /magicsudoku-android-latest.apk      "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicsudoku-android-latest.apk";
    /magicviewer-setup-latest.zip        "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicviewer-setup-latest.zip";
    /magicviewer-latest.zip              "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicviewer-latest.zip";
    /magiccarve-setup-latest.zip         "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magiccarve-setup-latest.zip";
    /magiccarve-latest.zip               "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magiccarve-latest.zip";
    /magicstat-setup-latest.zip          "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicstat-setup-latest.zip";
    /magicstat-latest.zip                "https://github.com/alaahadyhostinger/download/releases/download/v2.0.0/magicstat-latest.zip";
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0;
    sendfile             on;
    tcp_nopush           on;

    # Compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/xml
                      application/javascript
                      application/json
                      image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # Serve static files directly, or fallback cleanly to GitHub Release CDN
    location / {
        try_files $uri $uri/ $uri.html @fallback;
    }

    location @fallback {
        if ($github_fallback_url != "") {
            return 302 $github_fallback_url;
        }
        return 404;
    }

    # Healthcheck endpoint for Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
