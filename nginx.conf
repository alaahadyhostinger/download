# Fallback targets, used only when a binary has not been uploaded to the server
# yet. Keeps every published download URL working from the moment it exists.
# This sits outside `server` because `map` belongs to the http context, and
# conf.d/*.conf is included there.
map $uri $github_fallback_url {
    default                  "";
    /magicpdf-latest.zip     "https://github.com/alaahadyhostinger/magicpdf/releases/latest/download/magicpdf-portable.zip";
    /magicvideo-latest.zip   "https://github.com/alaahadyhostinger/magicvideo/releases/latest/download/magicvideo-portable.zip";
    /magicvideo-latest.dmg   "https://github.com/alaahadyhostinger/magicvideo/releases/latest/download/magicvideo-macos.dmg";
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Coolify's proxy terminates TLS and sits in front of this container, so no
    # TLS or redirect handling belongs here.

    # Binaries are large; never buffer them to disk or cap the response size.
    client_max_body_size 0;
    sendfile             on;
    tcp_nopush           on;

    # ---- compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/xml
                      application/javascript
                      application/json
                      image/svg+xml;

    # ---- headers -----------------------------------------------------------
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;

    # ---- routing -----------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # index.html must never be cached, or visitors keep seeing an old page
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Asset filenames are stable (not content-hashed), so keep these windows
    # short enough that a redeploy is picked up the same day.
    # A single Cache-Control header - `expires` would emit a second, conflicting one.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(?:png|ico|svg|jpe?g|gif|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---- application downloads ---------------------------------------------
    # Uploaded by tools/deploy.py into /opt/amsol/downloads on the host, which
    # is bind-mounted here read-only. Filenames are deliberately version-less so
    # the public URL never changes between releases.
    location ~ ^/(?:magicpdf|magicvideo)-latest\.(?:exe|dmg|zip)$ {
        root /srv/downloads;

        # Serve the uploaded file; if it is not there yet, hand off to GitHub.
        try_files $uri @github_release;

        # Byte-range support (on by default) lets interrupted downloads resume.
        # Short cache: the filename is stable, so a long TTL would pin an old build.
        add_header Cache-Control          "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        gzip off;
    }

    # Update metadata. Must never be cached, or an app keeps seeing an old
    # version. CORS is open so a browser-based update check can read it.
    location ~ ^/(?:(?:magicpdf|magicvideo)/)?version\.json$ {
        root /srv/downloads;
        try_files $uri =404;

        default_type application/json;
        add_header Cache-Control              "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options      nosniff always;
    }

    location @github_release {
        # Unmapped path reaching here would otherwise redirect to an empty URL.
        if ($github_fallback_url = "") {
            return 404;
        }
        add_header Cache-Control "no-store" always;
        return 302 $github_fallback_url;
    }

    # Don't fill the log with health checks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
