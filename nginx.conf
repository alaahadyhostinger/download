server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Coolify's proxy terminates TLS and sits in front of this container, so no
    # TLS or redirect handling belongs here.

    # ---- compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/xml
                      application/javascript
                      application/json
                      image/svg+xml;

    # ---- headers -----------------------------------------------------------
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;

    # ---- routing -----------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # index.html must never be cached, or visitors keep seeing an old page
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Asset filenames are stable (not content-hashed), so keep these windows
    # short enough that a redeploy is picked up the same day.
    # A single Cache-Control header - `expires` would emit a second, conflicting one.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(?:png|ico|svg|jpe?g|gif|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Don't fill the log with health checks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
