# Nginx configuration for download.amsol.ca (Coolify / Caddy Proxy)
map $uri $github_fallback_url {
    default                  "";
    /magicpdf-setup.exe      "https://github.com/alaahadyhostinger/magicpdf/releases/latest/download/magicpdf-setup.exe";
    /magicpdf-latest.zip     "https://github.com/alaahadyhostinger/magicpdf/releases/latest/download/magicpdf-portable.zip";
    /magicvideo-latest.zip   "https://github.com/alaahadyhostinger/magicvideo/releases/latest/download/magicvideo-portable.zip";
    /magicvideo-latest.dmg   "https://github.com/alaahadyhostinger/magicvideo/releases/latest/download/magicvideo-macos.dmg";
    /magicwatch-latest.zip   "https://github.com/alaahadyhostinger/download/raw/main/magicwatch-latest.zip";
    /magicmidi-latest.zip    "https://github.com/alaahadyhostinger/download/raw/main/magicmidi-latest.zip";
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0;
    sendfile             on;
    tcp_nopush           on;

    # Compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/xml
                      application/javascript
                      application/json
                      image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # Serve static files directly, or fallback cleanly
    location / {
        try_files $uri $uri/ $uri.html @fallback;
    }

    location @fallback {
        if ($github_fallback_url != "") {
            return 302 $github_fallback_url;
        }
        return 404;
    }

    # Healthcheck endpoint for Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
